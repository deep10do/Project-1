<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Hello, World!</title>
    <style>
      :root { --ink:#f8fafc; --muted:#cbd5e1; --card:rgba(15,23,42,.7); --line:rgba(255,255,255,.16); --accent:#a5f3fc; }
      * { box-sizing:border-box; } body { min-height:100vh; margin:0; display:grid; place-items:center; padding:2rem; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,sans-serif; background:radial-gradient(circle at 14% 80%,#0e7490 0,transparent 28rem),radial-gradient(circle at 85% 15%,#7c3aed 0,transparent 27rem),#101828; }
      main { width:min(100%,720px); padding:clamp(2rem,6vw,4.5rem); border:1px solid var(--line); border-radius:2rem; background:var(--card); box-shadow:0 24px 80px rgba(0,0,0,.35); backdrop-filter:blur(18px); } nav { display:flex; gap:1rem; margin-bottom:3rem; } nav a { color:var(--muted); text-decoration:none; } nav a:hover, nav a[aria-current="page"] { color:#fff; } nav a[aria-current="page"] { font-weight:700; }
      .eyebrow { color:var(--accent); font-size:.82rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; } h1 { margin:.65rem 0 1rem; font-size:clamp(2.7rem,8vw,5rem); line-height:1; letter-spacing:-.055em; } p { color:var(--muted); font-size:1.08rem; line-height:1.75; } form { display:grid; gap:1rem; margin-top:2rem; } label { display:grid; gap:.45rem; color:var(--muted); font-size:.9rem; } input, textarea { width:100%; padding:.85rem 1rem; border:1px solid var(--line); border-radius:.8rem; color:var(--ink); font:inherit; background:rgba(255,255,255,.06); } textarea { min-height:7rem; resize:vertical; } button { justify-self:start; padding:.85rem 1.15rem; border:0; border-radius:.8rem; color:#10202b; background:var(--accent); font:inherit; font-weight:800; cursor:pointer; } #status { min-height:1.5em; margin:0; color:#a7f3d0; font-size:.95rem; }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Primary navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
      <span class="eyebrow">Get in touch</span>
      <h1>Let’s make something.</h1>
      <p>Send a note and start a conversation. This demo form confirms your message locally.</p>
      <form id="contact-form"><label>Name<input name="name" autocomplete="name" required /></label><label>Email<input type="email" name="email" autocomplete="email" required /></label><label>Message<textarea name="message" required></textarea></label><button type="submit">Send message</button><p id="status" aria-live="polite"></p></form>
    </main>
    <script>document.querySelector('#contact-form').addEventListener('submit', event => { event.preventDefault(); event.currentTarget.reset(); document.querySelector('#status').textContent = 'Thanks! Your message is ready to send.'; });</script>
  </body>
</html>
